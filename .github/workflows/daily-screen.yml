name: daily-screen
# 每个工作日 01:30 UTC（北京 09:30，含 GitHub 调度延迟约落在 09:30-10:00）运行主升浪选股
on:
  schedule:
    - cron: '30 1 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  screen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 运行主升浪选股
        run: python3 scripts/screen_cloud.py

      - name: 抓取开盘啦快照
        run: python3 scripts/fetch_kpl.py

      - name: 提交报告
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/ data/
          if git diff --cached --quiet; then
            echo "今日报告无变化，跳过提交"
          else
            git commit -m "选股报告更新 $(TZ=Asia/Shanghai date +'%Y-%m-%d %H:%M')"
            git push
          fi
