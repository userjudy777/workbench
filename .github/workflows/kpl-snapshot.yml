name: kpl-snapshot
# 工作日盘中每 30 分钟抓取一次开盘啦快照（北京 09:30-15:30 → UTC 01:30-07:30）
on:
  schedule:
    - cron: '35 1,2,3,4,5,6,7 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 抓取开盘啦快照
        run: python3 scripts/fetch_kpl.py

      - name: 提交快照
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "快照无变化，跳过提交"
          else
            git commit -m "开盘啦快照 $(TZ=Asia/Shanghai date +'%H:%M')"
            git push
          fi
